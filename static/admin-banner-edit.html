<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轮播图编辑 - YOYOLE 管理后台</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .edit-shell { max-width: 940px; margin: 0 auto; padding: 24px; }
    .edit-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .edit-header h1 { font-size: 24px; }
    .card { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font: inherit; box-sizing: border-box; }
    .form-hint { font-size: 12px; color: #94a3b8; margin-top: 5px; }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .edit-grid .full { grid-column: 1 / -1; }
    /* 实时预览（模拟首页 Hero） */
    .preview-wrap { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fff; }
    .preview-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 13px; color: #64748b; font-weight: 600; }
    .preview-box { position: relative; height: 340px; background: linear-gradient(135deg, #1e293b, #475569); display: flex; align-items: center; }
    .preview-box.has-img { background-size: cover; background-position: center; }
    .preview-box .p-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(15,23,42,.72), rgba(15,23,42,.25) 65%, transparent); }
    .preview-box .p-content { position: relative; z-index: 1; padding: 0 48px; max-width: 60%; }
    .preview-box .p-label { color: #fda4af; font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
    .preview-box .p-title { color: #fff; font-size: 34px; font-weight: 800; line-height: 1.2; margin-bottom: 12px; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
    .preview-box .p-sub { color: rgba(255,255,255,.85); font-size: 15px; line-height: 1.7; margin-bottom: 20px; }
    .preview-box .p-btn { display: inline-block; background: #e02e24; color: #fff; font-size: 14px; font-weight: 700; padding: 11px 26px; border-radius: 999px; text-decoration: none; }
    .preview-box .p-btn:empty { display: none; }
    .preview-box .p-link { color: rgba(255,255,255,.55); font-size: 12px; margin-top: 12px; word-break: break-all; }
    .media-preview { margin-top: 10px; }
    .media-item { border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #f8fafc; }
    .media-item img { display: none; width: 100%; height: 170px; object-fit: cover; }
    .media-item.has-image img { display: block; }
    .media-item span { display: flex; height: 170px; align-items: center; justify-content: center; color: #94a3b8; font-size: 13px; }
    .media-item.has-image span { display: none; }
    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .status-msg { color: #64748b; font-size: 13px; align-self: center; }
    .error { color: #e02e24; }
    @media (max-width: 700px) {
      .edit-shell { padding: 16px; }
      .edit-grid { grid-template-columns: 1fr; }
      .edit-grid .full { grid-column: auto; }
      .preview-box .p-content { padding: 0 24px; max-width: 80%; }
      .preview-box .p-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="edit-shell">
    <div id="loading" class="card">正在准备轮播编辑页...</div>
    <div id="error" class="card error hidden"></div>
    <section id="editor" class="hidden">
      <header class="edit-header">
        <div>
          <button class="btn btn-outline btn-sm" id="back-btn">返回首页和用户管理</button>
          <h1 id="page-title" style="margin-top:12px">新增轮播图</h1>
        </div>
        <span id="save-status" class="status-msg"></span>
      </header>

      <!-- 实时预览 -->
      <div class="card">
        <div class="preview-wrap">
          <div class="preview-head">首页 Hero 预览（实时更新）</div>
          <div class="preview-box" id="preview-box">
            <div class="p-overlay"></div>
            <div class="p-content">
              <div class="p-label" id="pv-label">YOYOLE</div>
              <div class="p-title" id="pv-title">瑜伽与户外新日常</div>
              <div class="p-sub" id="pv-sub">让身体回到自然</div>
              <a class="p-btn" id="pv-btn" href="javascript:void(0)">立即探索</a>
              <div class="p-link" id="pv-link"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 基本信息 -->
      <div class="card" style="padding:20px">
        <h2 style="margin-bottom:16px">文案内容</h2>
        <div class="edit-grid">
          <div class="form-group"><label>标题（中文）</label><input id="title-zh" placeholder="如 瑜伽与户外新日常"></div>
          <div class="form-group"><label>标题（English）</label><input id="title-en" placeholder="如 A New Everyday in Yoga and Outdoors"></div>
          <div class="form-group"><label>副标题（中文）</label><input id="subtitle-zh" placeholder="如 让身体回到自然"></div>
          <div class="form-group"><label>副标题（English）</label><input id="subtitle-en" placeholder="Sub title"></div>
          <div class="form-group"><label>按钮文字（中文）</label><input id="btn-zh" placeholder="如 立即探索"></div>
          <div class="form-group"><label>按钮文字（English）</label><input id="btn-en" placeholder="如 Explore Now"></div>
        </div>
      </div>

      <!-- 图片与链接 -->
      <div class="card" style="padding:20px">
        <h2 style="margin-bottom:16px">图片与跳转</h2>
        <div class="form-group">
          <label>背景图片</label>
          <div class="media-item" id="img-preview">
            <img id="img-preview-img" alt="轮播图">
            <span>未设置背景图</span>
          </div>
          <input id="img-file" type="file" accept="image/*" hidden>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-outline btn-sm" id="img-upload">上传图片</button>
            <button class="btn btn-danger btn-sm" id="img-remove" style="display:none">移除图片</button>
          </div>
          <div class="form-hint">建议 1920×1080 或 1600×900（16:9）、jpg/png/webp，≤5MB；<b>图片会以比例铺满轮播区，请避免把重要内容放在上下边缘</b></div>
        </div>
        <div class="edit-grid" style="margin-top:16px">
          <div class="form-group"><label>视频 URL（可选，mp4/webm，优先于图片）</label><input id="video-url" placeholder="https://.../hero.mp4"></div>
          <div class="form-group"><label>跳转链接</label><input id="link-url" placeholder="如 /products.html 或 https://..."></div>
          <div class="form-group"><label>排序（数字越小越靠前）</label><input id="sort-order" type="number" value="0"></div>
          <div class="form-group"><label>状态</label><select id="is-active">
            <option value="1">启用</option>
            <option value="0">停用</option>
          </select></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="save-btn">保存轮播</button>
        <button class="btn btn-outline" id="delete-btn" style="display:none">删除轮播</button>
        <span id="action-status" class="status-msg"></span>
      </div>
    </section>
  </main>

  <script src="/static/js/common.js?v=8"></script>
  <script>
    (function () {
      var App = window.App;
      var token = App.getAdminToken();
      var params = new URLSearchParams(location.search);
      var isCreate = params.get('new') === '1';
      var bannerId = Number(params.get('id'));
      if (isCreate) bannerId = 0;
      var imgUrl = '';

      function showError(message) {
        document.getElementById('loading').classList.add('hidden');
        var el = document.getElementById('error');
        el.textContent = message;
        el.classList.remove('hidden');
      }

      function api(path, options) {
        options = options || {};
        return App.api(path, Object.assign({}, options, { token: token, includeLang: false }));
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // ---- 实时预览 ----
      function renderPreview() {
        var titleZh = document.getElementById('title-zh').value.trim() || '标题（等待输入）';
        var subZh = document.getElementById('subtitle-zh').value.trim();
        var btnZh = document.getElementById('btn-zh').value.trim();
        var link = document.getElementById('link-url').value.trim();
        document.getElementById('pv-title').textContent = titleZh;
        document.getElementById('pv-sub').textContent = subZh || '副标题（等待输入）';
        var pvBtn = document.getElementById('pv-btn');
        pvBtn.textContent = btnZh;
        if (link) {
          pvBtn.style.display = 'inline-block';
          document.getElementById('pv-link').textContent = '跳转目标：' + link;
          document.getElementById('pv-link').style.display = 'block';
        } else {
          pvBtn.style.display = 'none';
          document.getElementById('pv-link').textContent = '';
        }
        var box = document.getElementById('preview-box');
        if (imgUrl) {
          box.style.backgroundImage = 'url("' + imgUrl + '")';
          box.classList.add('has-img');
        } else {
          box.style.backgroundImage = '';
          box.classList.remove('has-img');
        }
      }
      function bindPreview() {
        ['title-zh', 'subtitle-zh', 'btn-zh', 'link-url'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', renderPreview);
        });
      }

      // ---- 图片 ----
      function renderImg() {
        var item = document.getElementById('img-preview');
        var img = document.getElementById('img-preview-img');
        var removeBtn = document.getElementById('img-remove');
        if (imgUrl) {
          img.src = imgUrl; img.style.display = ''; img.alt = '轮播图';
          item.classList.add('has-image');
          removeBtn.style.display = '';
        } else {
          img.removeAttribute('src'); img.style.display = '';
          item.classList.remove('has-image');
          removeBtn.style.display = 'none';
        }
      }
      function uploadImageFile(file) {
        return new Promise(function (resolve, reject) {
          var fd = new FormData();
          fd.append('file', file);
          fetch('/api/upload?kind=image', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            body: fd,
          }).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              if (res.ok) resolve(data.url);
              else reject(new Error(data.detail || '上传失败'));
            });
          }).catch(reject);
        });
      }

      // ---- 保存 / 删除 ----
      function collect() {
        return {
          placement: 'home_hero',
          title_i18n: { zh: document.getElementById('title-zh').value.trim(), en: document.getElementById('title-en').value.trim() },
          subtitle_i18n: { zh: document.getElementById('subtitle-zh').value.trim(), en: document.getElementById('subtitle-en').value.trim() },
          button_text_i18n: { zh: document.getElementById('btn-zh').value.trim(), en: document.getElementById('btn-en').value.trim() },
          image_url: imgUrl || null,
          video_url: document.getElementById('video-url').value.trim() || null,
          link_url: document.getElementById('link-url').value.trim() || null,
          sort_order: Number(document.getElementById('sort-order').value || 0),
          is_active: document.getElementById('is-active').value === '1',
        };
      }

      function save() {
        var body = collect();
        if (!body.title_i18n.zh && !body.subtitle_i18n.zh && !imgUrl) {
          document.getElementById('action-status').textContent = '请至少填写标题或上传背景图';
          return;
        }
        var path = bannerId ? '/api/admin/banners/' + bannerId : '/api/admin/banners';
        api(path, { method: bannerId ? 'PUT' : 'POST', body: body })
          .then(function (d) {
            document.getElementById('save-status').textContent = '已保存 ✓';
            App.toast(bannerId ? '轮播已更新' : '轮播已创建', 'success');
            if (!bannerId) { bannerId = d.id; location.href = '/admin-banner-edit.html?id=' + d.id; }
            else location.href = '/admin.html?view=home';
          })
          .catch(function (e) { document.getElementById('action-status').textContent = e.message || '保存失败'; App.toast(e.message, 'error'); });
      }

      function del() {
        return App.confirmDialog('删除后首页轮播将不再展示该图。', {
          title: '删除首页轮播', tone: 'danger', okText: '确认删除',
        }).then(function (ok) {
          if (!ok) return;
          return api('/api/admin/banners/' + bannerId, { method: 'DELETE' })
            .then(function () { App.toast('轮播已删除', 'success'); location.href = '/admin.html?view=home'; })
            .catch(function (e) { App.toast(e.message, 'error'); });
        });
      }

      // ---- 初始化 ----
      document.getElementById('back-btn').onclick = function () { location.href = '/admin.html?view=home'; };
      document.getElementById('save-btn').onclick = save;
      document.getElementById('delete-btn').onclick = del;
      document.getElementById('img-upload').onclick = function () { document.getElementById('img-file').click(); };
      document.getElementById('img-file').onchange = function () {
        if (!this.files || !this.files[0]) return;
        var file = this.files[0];
        var btn = document.getElementById('img-upload');
        btn.disabled = true;
        uploadImageFile(file).then(function (url) {
          imgUrl = url;
          renderImg(); renderPreview();
          App.toast('图片已上传', 'success');
        }).catch(function (e) { App.toast(e.message, 'error'); })
          .finally(function () { btn.disabled = false; });
      };
      document.getElementById('img-remove').onclick = function () { imgUrl = ''; renderImg(); renderPreview(); };

      if (!token) { showError('登录已失效，请先登录 ERP 后台。'); }
      else if (!bannerId && isCreate) { fill({}); }
      else if (!bannerId) { showError('缺少轮播 ID。'); }
      else {
        api('/api/admin/banners/' + bannerId)
          .then(function (b) {
            if (!b) throw new Error('轮播不存在');
            fill(b);
          })
          .catch(function (e) { showError(e.message || '轮播加载失败'); });
      }

      function fill(b) {
        document.getElementById('page-title').textContent = b && b.id ? '编辑轮播 #' + b.id : '新增轮播图';
        document.getElementById('title-zh').value = (b.title_i18n && b.title_i18n.zh) || '';
        document.getElementById('title-en').value = (b.title_i18n && b.title_i18n.en) || '';
        document.getElementById('subtitle-zh').value = (b.subtitle_i18n && b.subtitle_i18n.zh) || '';
        document.getElementById('subtitle-en').value = (b.subtitle_i18n && b.subtitle_i18n.en) || '';
        document.getElementById('btn-zh').value = (b.button_text_i18n && b.button_text_i18n.zh) || '';
        document.getElementById('btn-en').value = (b.button_text_i18n && b.button_text_i18n.en) || '';
        imgUrl = b.image_url || '';
        renderImg();
        document.getElementById('video-url').value = b.video_url || '';
        document.getElementById('link-url').value = b.link_url || '';
        document.getElementById('sort-order').value = b.sort_order || 0;
        document.getElementById('is-active').value = (isCreate || (b && b.is_active)) ? '1' : '0';
        if (b && b.id) { document.getElementById('delete-btn').style.display = ''; }
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('editor').classList.remove('hidden');
        renderPreview();
      }

      bindPreview();
    })();
  </script>
</body>
</html>
