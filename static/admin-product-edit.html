<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>装备编辑 - YOYOLE 管理后台</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .edit-shell { max-width: 980px; margin: 0 auto; padding: 24px; }
    .edit-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    .edit-header h1 { font-size: 24px; }
    .edit-card { margin-bottom: 18px; }
    .edit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .edit-grid .full { grid-column: 1 / -1; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
    .form-group textarea { resize: vertical; }
    .media-preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .media-item { position: relative; width: 104px; height: 88px; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; }
    .media-item img { width: 100%; height: 100%; object-fit: cover; }
    .media-item button { position: absolute; top: 4px; right: 4px; padding: 1px 6px; border: 0; border-radius: 4px; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; }
    .main-preview { width: 180px; height: 135px; }
    .main-preview img { display: none; }
    .main-preview.has-image img { display: block; }
    .main-preview span { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; }
    .main-preview.has-image span { display: none; }
    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .status { color: var(--text-muted); font-size: 13px; }
    .sku-table { width: 100%; border-collapse: collapse; }
    .sku-table th, .sku-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .sku-table input { width: 90px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
    .error { color: var(--danger); }
    @media (max-width: 680px) {
      .edit-shell { padding: 16px; }
      .edit-grid { grid-template-columns: 1fr; }
      .edit-grid .full { grid-column: auto; }
      .edit-header { align-items: flex-start; flex-direction: column; }
      .sku-table { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="edit-shell">
    <div id="loading" class="card">正在准备商品编辑页...</div>
    <div id="error" class="card error hidden"></div>
    <section id="editor" class="hidden">
      <header class="edit-header">
        <div>
          <button class="btn btn-outline btn-sm" id="back-btn">返回商品管理</button>
          <h1 id="page-title" style="margin-top:12px">商品编辑</h1>
        </div>
        <span id="save-status" class="status"></span>
      </header>

      <div class="card edit-card">
        <h2 style="margin-bottom:16px">基础信息</h2>
        <div class="edit-grid">
          <div class="form-group"><label>SKU 编码（系统自动生成）</label><input id="sku-code" type="text" readonly aria-readonly="true"></div>
          <div class="form-group"><label>品牌</label><input id="brand" type="text" placeholder="品牌名称"></div>
          <div class="form-group"><label>名称（中文）</label><input id="name-zh" type="text"></div>
          <div class="form-group"><label>名称（英文）</label><input id="name-en" type="text"></div>
          <div class="form-group full"><label>详情描述（中文）</label><textarea id="desc-zh" rows="5"></textarea></div>
          <div class="form-group full"><label>详情描述（英文）</label><textarea id="desc-en" rows="5"></textarea></div>
          <div class="form-group"><label>分类</label><select id="category"><option value="">未分类</option></select></div>
          <div class="form-group"><label>基础价格</label><input id="price" type="number" min="0.01" step="0.01"></div>
          <div class="form-group" id="initial-stock-group"><label>初始库存</label><input id="initial-stock" type="number" min="0" step="1" value="0"></div>
          <div class="form-group"><label>状态</label><select id="status"><option value="active">上架</option><option value="draft">草稿</option><option value="off_shelf">下架</option></select></div>
          <div class="form-group" style="display:flex;align-items:end"><label><input id="featured" type="checkbox"> 设为推荐商品</label></div>
        </div>
      </div>

      <div class="card edit-card">
        <h2 style="margin-bottom:16px">商品图片</h2>
        <div class="form-group">
          <label>主图</label>
          <div id="main-preview" class="media-item main-preview"><img id="main-image" alt="商品主图"><span>未设置主图</span></div>
          <input id="main-file" type="file" accept="image/*" hidden>
          <button class="btn btn-outline btn-sm" id="main-upload">上传主图</button>
          <button class="btn btn-danger btn-sm" id="main-remove" style="display:none">移除主图</button>
        </div>
        <div class="form-group" style="margin-top:18px">
          <label>详情轮播图</label>
          <div id="gallery" class="media-preview"></div>
          <input id="gallery-files" type="file" accept="image/*" multiple hidden>
          <button class="btn btn-outline btn-sm" id="gallery-upload">添加轮播图</button>
        </div>
      </div>

      <div class="card edit-card">
        <h2 style="margin-bottom:8px">SKU 与库存</h2>
        <p class="status" style="margin-bottom:10px">可在此调整库存，价格与规格暂沿用已有 SKU 配置。</p>
        <div id="sku-list"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="save-btn">保存全部修改</button>
        <button class="btn btn-outline" id="cancel-btn">取消</button>
        <span id="action-status" class="status"></span>
      </div>
    </section>
  </main>
  <script src="/static/js/common.js?v=6"></script>
  <script>
    (function () {
      var App = window.App;
      var token = App.getAdminToken();
      var params = new URLSearchParams(location.search);
      var isCreate = params.get('new') === '1';
      var productId = Number(params.get('id'));
      var product = null;
      var mainImage = '';
      var gallery = [];

      function showError(message) {
        document.getElementById('loading').classList.add('hidden');
        var el = document.getElementById('error');
        el.textContent = message;
        el.classList.remove('hidden');
      }

      function api(path, options) {
        options = options || {};
        return App.api(path, Object.assign({}, options, { token: token, includeLang: false }));
      }

      function uploadImage(file) {
        var form = new FormData();
        form.append('file', file);
        return fetch('/api/upload?kind=image', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form })
          .then(function (res) { return res.json().then(function (data) { if (!res.ok) throw new Error(data.detail || '图片上传失败'); return data.url; }); });
      }

      function renderMainImage() {
        var box = document.getElementById('main-preview');
        var image = document.getElementById('main-image');
        image.src = mainImage || '';
        box.classList.toggle('has-image', !!mainImage);
        document.getElementById('main-remove').style.display = mainImage ? '' : 'none';
      }

      function renderGallery() {
        document.getElementById('gallery').innerHTML = gallery.map(function (url, index) {
          return '<div class="media-item"><img src="' + url + '" alt="详情图"><button type="button" data-index="' + index + '">×</button></div>';
        }).join('');
        document.querySelectorAll('#gallery button').forEach(function (button) {
          button.onclick = function () { gallery.splice(Number(button.dataset.index), 1); renderGallery(); };
        });
      }

      function renderSkus() {
        var rows = (product.skus || []).map(function (sku) {
          return '<tr><td>' + sku.sku_code + '</td><td>' + App.money(sku.price) + '</td><td>'
            + (sku.attributes ? JSON.stringify(sku.attributes) : '-') + '</td><td><input type="number" min="0" value="' + (sku.stock || 0) + '" data-sku-id="' + sku.id + '"></td><td>' + (sku.available_stock || 0) + '</td><td><button class="btn btn-outline btn-sm" data-save-stock="' + sku.id + '">保存库存</button></td></tr>';
        }).join('');
        document.getElementById('sku-list').innerHTML = rows
          ? '<table class="sku-table"><thead><tr><th>SKU</th><th>价格</th><th>规格</th><th>库存</th><th>可用</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<p class="status">暂无 SKU</p>';
        document.querySelectorAll('[data-save-stock]').forEach(function (button) {
          button.onclick = function () {
            var input = document.querySelector('input[data-sku-id="' + button.dataset.saveStock + '"]');
            api('/api/admin/skus/' + button.dataset.saveStock + '/stock', { method: 'PUT', body: { stock: Number(input.value), reason: 'admin_product_edit' } })
              .then(function (data) { App.toast('库存已更新', 'success'); input.value = data.stock; })
              .catch(function (error) { App.toast(error.message, 'error'); });
          };
        });
      }

      function loadCategories() {
        return api('/api/admin/categories').then(function (list) {
          var select = document.getElementById('category');
          select.innerHTML = '<option value="">未分类</option>' + (list || []).map(function (category) {
            return '<option value="' + category.id + '">' + (category.name_i18n.zh || category.code) + '</option>';
          }).join('');
          if (product && product.category_id) select.value = product.category_id;
        });
      }

      function fillForm() {
        document.getElementById('page-title').textContent = isCreate ? '新增商品' : '编辑商品 #' + product.id;
        document.getElementById('sku-code').value = product.sku_code || '';
        document.getElementById('brand').value = product.brand || '';
        document.getElementById('name-zh').value = (product.name_i18n || {}).zh || '';
        document.getElementById('name-en').value = (product.name_i18n || {}).en || '';
        document.getElementById('desc-zh').value = (product.description_i18n || {}).zh || '';
        document.getElementById('desc-en').value = (product.description_i18n || {}).en || '';
        document.getElementById('price').value = product.base_price || '';
        document.getElementById('initial-stock').value = product.skus && product.skus[0] ? (product.skus[0].stock || 0) : 0;
        document.getElementById('initial-stock-group').style.display = isCreate ? '' : 'none';
        document.getElementById('status').value = product.status || 'active';
        document.getElementById('featured').checked = !!product.is_featured;
        mainImage = product.main_image || '';
        gallery = (product.images || []).slice();
        renderMainImage();
        renderGallery();
        renderSkus();
      }

      function saveProduct() {
        var nameZh = document.getElementById('name-zh').value.trim();
        var price = Number(document.getElementById('price').value);
        if (!nameZh) { App.toast('请填写中文商品名称', 'error'); return; }
        if (!price || price <= 0) { App.toast('请填写有效价格', 'error'); return; }
        var button = document.getElementById('save-btn');
        button.disabled = true;
        var body = {
            category_id: document.getElementById('category').value ? Number(document.getElementById('category').value) : null,
            name_zh: nameZh,
            name_en: document.getElementById('name-en').value.trim(),
            brand: document.getElementById('brand').value.trim(),
            description_zh: document.getElementById('desc-zh').value,
            description_en: document.getElementById('desc-en').value,
            main_image: mainImage || null,
            images: gallery,
            base_price: price,
            status: document.getElementById('status').value,
            is_featured: document.getElementById('featured').checked,
          };
        var request;
        if (isCreate) {
          body.sku_code = document.getElementById('sku-code').value;
          body.skus = [{
            sku_code: body.sku_code,
            price: price,
            stock: Number(document.getElementById('initial-stock').value) || 0,
            attributes: {},
          }];
          request = api('/api/admin/products', { method: 'POST', body: body });
        } else {
          request = api('/api/admin/products/' + productId, { method: 'PUT', body: body });
        }
        request.then(function (saved) {
          document.getElementById('action-status').textContent = '保存成功';
          App.toast(isCreate ? '商品已创建' : '商品信息已保存', 'success');
          location.replace('/admin.html?view=products');
        }).catch(function (error) { App.toast(error.message, 'error'); })
          .finally(function () { button.disabled = false; });
      }

      document.getElementById('back-btn').onclick = function () { location.href = '/admin.html?view=products'; };
      document.getElementById('cancel-btn').onclick = function () { location.href = '/admin.html?view=products'; };
      document.getElementById('save-btn').onclick = saveProduct;
      document.getElementById('main-upload').onclick = function () { document.getElementById('main-file').click(); };
      document.getElementById('main-file').onchange = function () {
        if (!this.files[0]) return;
        uploadImage(this.files[0]).then(function (url) { mainImage = url; renderMainImage(); App.toast('主图上传成功', 'success'); }).catch(function (error) { App.toast(error.message, 'error'); });
        this.value = '';
      };
      document.getElementById('main-remove').onclick = function () { mainImage = ''; renderMainImage(); };
      document.getElementById('gallery-upload').onclick = function () { document.getElementById('gallery-files').click(); };
      document.getElementById('gallery-files').onchange = function () {
        var files = Array.prototype.slice.call(this.files || []);
        var next = function () {
          if (!files.length) { renderGallery(); App.toast('轮播图上传成功', 'success'); return; }
          uploadImage(files.shift()).then(function (url) { gallery.push(url); next(); }).catch(function (error) { App.toast(error.message, 'error'); next(); });
        };
        next();
        this.value = '';
      };

      if (!token) { showError('登录已失效，请先登录 ERP 后台。'); }
      else if (!isCreate && !productId) { showError('缺少商品 ID。'); }
      else {
        var productRequest = isCreate ? Promise.resolve([]) : api('/api/admin/products');
        Promise.all([productRequest, loadCategories()])
          .then(function (results) {
            if (isCreate) {
              product = {
                id: null,
                sku_code: 'YOYOLE-' + Date.now().toString(36).toUpperCase() + '-' + Math.floor(Math.random() * 900 + 100),
                brand: '',
                name_i18n: { zh: '', en: '' },
                description_i18n: { zh: '', en: '' },
                base_price: '',
                category_id: null,
                status: 'draft',
                is_featured: false,
                main_image: '',
                images: [],
                skus: [],
              };
            } else {
              product = (results[0] || []).filter(function (item) { return item.id === productId; })[0];
              if (!product) throw new Error('商品不存在');
            }
            fillForm();
            document.getElementById('category').value = product.category_id || '';
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('editor').classList.remove('hidden');
          })
          .catch(function (error) { showError(error.message || '商品加载失败'); });
      }
    })();
  </script>
</body>
</html>
