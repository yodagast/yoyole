<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户故事审核 - YOYOLE 管理后台</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .review-shell { max-width: 860px; margin: 0 auto; padding: 24px; }
    .review-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .review-header h1 { font-size: 24px; }
    .card { margin-bottom: 18px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; box-sizing: border-box; }
    .form-group textarea { resize: vertical; }
    .story-preview { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 18px; background: #fff; }
    .story-preview .sp-img { max-height: 340px; overflow: hidden; background: #f8fafc; display: flex; align-items: center; justify-content: center; }
    .story-preview .sp-img img { width: 100%; display: block; object-fit: cover; }
    .story-preview .sp-img.no-img { height: 130px; color: #94a3b8; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .story-preview .sp-img #sp-no-img { color: #94a3b8; font-size: 13px; align-items: center; justify-content: center; }
    .story-preview .sp-body { padding: 20px 22px; }
    .story-preview .sp-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .story-preview .sp-content { color: var(--text-muted, #64748b); font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
    .story-preview .sp-meta { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .story-preview .sp-meta .author { font-weight: 600; font-size: 13px; }
    .story-preview .sp-meta .time { color: #94a3b8; font-size: 12px; }
    .story-preview .sp-meta .tag { font-size: 11px; font-weight: 700; color: var(--danger, #e02e24); background: rgba(224, 46, 36, .08); border-radius: 999px; padding: 3px 10px; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 3px 10px; }
    .badge.approved { background: #dcfce7; color: #166534; }
    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.rejected { background: #fee2e2; color: #b91c1c; }
    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .actions .btn-primary { background: var(--primary, #e02e24); border-color: var(--primary, #e02e24); color: #fff; }
    .actions .btn-danger { background: #b91c1c; border-color: #b91c1c; color: #fff; }
    .status-msg { color: var(--text-muted, #64748b); font-size: 13px; align-self: center; }
    .error { color: var(--danger, #e02e24); }
    @media (max-width: 680px) { .review-shell { padding: 16px; } }
  </style>
</head>
<body>
  <main class="review-shell">
    <div id="loading" class="card">正在加载用户故事...</div>
    <div id="error" class="card error hidden"></div>

    <div id="editor" class="hidden">
      <header class="review-header">
        <div>
          <button class="btn btn-outline btn-sm" id="back-btn">返回用户故事审核</button>
          <h1 style="margin-top:12px">用户故事审核</h1>
        </div>
        <span id="story-status-badge"></span>
      </header>

      <!-- 前台预览 -->
      <div class="story-preview">
        <div class="sp-img" id="sp-img">
          <img id="sp-image" src="" alt="故事图片" style="display:none">
          <span id="sp-no-img" style="display:none">未上传图片</span>
        </div>
        <div class="sp-body">
          <div class="sp-title" id="sp-title"></div>
          <div class="sp-content" id="sp-content"></div>
          <div class="sp-meta">
            <span class="author" id="sp-author"></span>
            <span class="time" id="sp-time"></span>
            <span class="tag" id="sp-category"></span>
            <span class="tag" id="sp-tags"></span>
          </div>
        </div>
      </div>

      <!-- 编辑表单 -->
      <div class="card" style="padding:20px">
        <h2 style="margin-bottom:16px">编辑内容</h2>
        <div class="form-group" style="margin-bottom:12px">
          <label>标题</label>
          <input type="text" id="form-title">
        </div>
        <div class="form-group" style="margin-bottom:12px">
          <label>分类（仅作兼容字段）</label>
          <select id="form-category">
            <option value="yoga">瑜伽练习</option>
            <option value="outdoor">户外出发</option>
            <option value="life">生活方式</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:12px">
          <label>标签（逗号/顿号分隔，最多 6 个）</label>
          <input type="text" id="form-tags" placeholder="例如：晨练, 冥想, 露营">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label>内容</label>
          <textarea id="form-content" rows="6"></textarea>
        </div>
        <div class="form-group" style="margin-bottom:14px" id="reject-group">
          <label>驳回理由（必填，用户可见）</label>
          <input type="text" id="form-reject" placeholder="例如：内容与主题不符 / 广告 / 不当信息">
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="save-publish-btn">保存并发布</button>
          <button class="btn btn-outline" id="reject-btn">驳回</button>
          <button class="btn btn-outline" id="toggle-btn"></button>
          <button class="btn btn-danger" id="delete-btn">删除</button>
          <span class="status-msg" id="action-status"></span>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/js/common.js?v=6"></script>
  <script>
    (function () {
      var App = window.App;
      var token = App.getAdminToken();
      var storyId = Number(new URLSearchParams(location.search).get('id'));
      var story = null;

      function showError(message) {
        document.getElementById('loading').classList.add('hidden');
        var el = document.getElementById('error');
        el.textContent = message;
        el.classList.remove('hidden');
      }

      function api(path, options) {
        options = options || {};
        return App.api(path, Object.assign({}, options, { token: token, includeLang: false }));
      }

      function badge(status) {
        if (status === 'approved') return '<span class="badge approved">已发布</span>';
        if (status === 'rejected') return '<span class="badge rejected">已驳回' + (story && story.reject_reason ? '：' + story.reject_reason : '') + '</span>';
        return '<span class="badge pending">待审核</span>';
      }

      function fill() {
        document.getElementById('story-status-badge').innerHTML = badge(story.status);
        // 预览区
        var img = document.getElementById('sp-image');
        var imgBox = document.getElementById('sp-img');
        var noImg = document.getElementById('sp-no-img');
        if (story.image_url) {
          img.src = story.image_url;
          img.style.display = 'block';
          noImg.style.display = 'none';
          imgBox.classList.remove('no-img');
        } else {
          img.style.display = 'none';
          noImg.style.display = 'flex';
          imgBox.classList.add('no-img');
        }
        document.getElementById('sp-title').textContent = story.title || '';
        document.getElementById('sp-content').textContent = story.content || '';
        document.getElementById('sp-author').textContent = story.author || '用户';
        document.getElementById('sp-time').textContent = story.created_at ? String(story.created_at).replace('T', ' ').slice(0, 19) : '';
        document.getElementById('sp-category').style.display = 'none';
        var tagBox = document.getElementById('sp-tags');
        tagBox.textContent = (story.tags || []).join(' ');
        tagBox.style.display = (story.tags || []).length ? '' : 'none';
        // 编辑表单
        document.getElementById('form-title').value = story.title || '';
        document.getElementById('form-category').value = story.category || 'life';
        document.getElementById('form-tags').value = (story.tags || []).join(', ');
        document.getElementById('form-content').value = story.content || '';
        document.getElementById('form-reject').value = '';
        document.getElementById('reject-group').style.display = story.status === 'rejected' ? 'block' : 'none';
        document.getElementById('toggle-btn').textContent = story.status === 'approved' ? '撤下' : '发布';
        document.getElementById('action-status').textContent = '';
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('editor').classList.remove('hidden');
      }

      function save(publish) {
        var title = document.getElementById('form-title').value.trim();
        var content = document.getElementById('form-content').value.trim();
        var category = document.getElementById('form-category').value;
        if (!title || !content) { App.toast('标题和内容不能为空', 'error'); return; }
        var tags = String(document.getElementById('form-tags').value || '').split(/[,，、]/).map(function (x) { return x.trim(); }).filter(function (x) { return x; }).slice(0, 6);
        var body = { title: title, content: content, category: category, tags: tags };
        if (publish === true) body.is_published = true;
        api('/api/admin/user-stories/' + storyId, { method: 'PUT', body: body })
          .then(function (saved) {
            story = saved;
            App.toast(publish === true ? '已保存并发布' : '已保存（保持当前状态）', 'success');
            fill();
          })
          .catch(function (e) { App.toast(e.message, 'error'); });
      }

      function reject() {
        var reason = document.getElementById('form-reject').value.trim();
        if (!reason) { App.toast('请填写驳回理由', 'error'); return; }
        api('/api/admin/user-stories/' + storyId, { method: 'PUT', body: { reject_reason: reason } })
          .then(function (saved) {
            story = saved;
            App.toast('已驳回', 'success');
            fill();
          })
          .catch(function (e) { App.toast(e.message, 'error'); });
      }

      function toggle() {
        api('/api/admin/user-stories/' + storyId, { method: 'PUT', body: { is_published: !story.is_published } })
          .then(function (saved) {
            story = saved;
            App.toast(story.is_published ? '用户故事已发布' : '用户故事已撤下', 'success');
            fill();
          })
          .catch(function (e) { App.toast(e.message, 'error'); });
      }

      function del() {
        if (!confirm('确认删除这条用户故事？')) return;
        api('/api/admin/user-stories/' + storyId, { method: 'DELETE' })
          .then(function () {
            App.toast('用户故事已删除', 'success');
            location.href = '/admin.html?view=cms';
          })
          .catch(function (e) { App.toast(e.message, 'error'); });
      }

      document.getElementById('back-btn').onclick = function () { location.href = '/admin.html?view=cms'; };
      document.getElementById('save-publish-btn').onclick = function () { save(true); };
      document.getElementById('reject-btn').onclick = reject;
      document.getElementById('toggle-btn').onclick = toggle;
      document.getElementById('delete-btn').onclick = del;

      if (!token) { showError('登录已失效，请先登录 ERP 后台。'); }
      else if (!storyId) { showError('缺少用户故事 ID。'); }
      else {
        api('/api/admin/user-stories').then(function (list) {
          story = (list || []).find(function (s) { return s.id === storyId; });
          if (!story) throw new Error('用户故事不存在');
          fill();
        }).catch(function (e) { showError(e.message || '用户故事加载失败'); });
      }
    })();
  </script>
</body>
</html>
