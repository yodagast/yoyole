<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单详情 - YOYOLE 管理后台</title>
  <link rel="stylesheet" href="/static/css/jjshouse.css">
  <style>
    .erp-top {
      background: #1e293b;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .erp-top .logo { font-size: 18px; font-weight: 700; }
    .erp-top .back {
      color: #cbd5e1; cursor: pointer; display: flex; align-items: center;
      gap: 4px; font-size: 14px; text-decoration: none;
    }
    .erp-top .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="erp-top">
      <a class="back" href="javascript:void(0)" id="od-back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        返回订单列表
      </a>
      <span class="logo"><img src="/static/img/yoyole-logo.svg" alt="YOYOLE" style="width:105px;height:28px;object-fit:contain;vertical-align:middle"> 管理后台 · 订单详情</span>
    </div>

    <div class="container" style="padding-bottom:40px">
      <div class="loading" id="od-loading">
        <div class="spinner"></div>加载中...
      </div>

      <div class="empty" id="od-error" style="display:none;padding-top:60px">
        <div style="font-size:44px">⚠</div>
        <div id="od-error-msg" style="margin-top:12px">订单不存在</div>
        <button class="btn btn-primary" style="margin-top:18px" onclick="history.back()">返回</button>
      </div>

      <div class="od-wrap" id="od-body" style="display:none"></div>
    </div>
  </div>

  <script src="/static/js/common.js?v=6"></script>
  <script>
    (function () {
      var App = window.App;

      function qs(name) {
        var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
        return m ? decodeURIComponent(m[1]) : '';
      }

      function fmt(s) { if (!s) return ''; return String(s).replace('T', ' ').slice(0, 19); }

      function badge(status) {
        return '<span class="badge badge-' + status + '">' + App.t(status) + '</span>';
      }

      function statusClass(status) {
        if (status === 'paid' || status === 'shipped') return 'od-paid';
        if (status === 'completed') return 'od-completed';
        if (status === 'cancelled' || status === 'refunded') return 'od-cancelled';
        return '';
      }

      function statusIcon(status) {
        if (status === 'pending') return '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>';
        if (status === 'shipped') return '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35a1 1 0 0 0-.78-.38H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>';
        if (status === 'completed') return '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
        if (status === 'cancelled') return '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
        return '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';
      }

      function render(o) {
        var items = (o.items || []).map(function (it, idx) {
          return '<div class="od-goods-item">'
            + '<img src="' + (it.image || 'https://picsum.photos/seed/' + idx + '/200/200') + '">'
            + '<div class="od-goods-info">'
            + '<div class="od-goods-name">' + it.product_name + '</div>'
            + '<div class="od-goods-spec">' + it.sku_code + '</div>'
            + '<div class="od-goods-price">' + App.money(it.unit_price) + '</div>'
            + '</div>'
            + '<div class="od-goods-qty">×' + it.quantity + '</div>'
            + '</div>';
        }).join('');

        var pays = (o.payments || []).map(function (p) {
          return '<div class="od-info-row"><span class="od-info-label">支付单号</span><span class="od-info-val">' + p.transaction_no + '</span></div>'
            + '<div class="od-info-row"><span class="od-info-label">支付方式</span><span class="od-info-val">' + p.method + '</span></div>';
        }).join('');

        var actions = '';
        if (o.status === 'paid') {
          actions = '<button class="btn btn-primary" id="od-ship">发货</button>';
        }

        document.getElementById('od-body').innerHTML =
          '<div class="od-header ' + statusClass(o.status) + '">'
          + '<div class="od-status-icon">' + statusIcon(o.status) + '</div>'
          + '<div class="od-header-text"><div class="od-status">' + App.t(o.status) + '</div>'
          + '<div class="od-status-tip">订单号：' + o.order_no + '</div></div>'
          + '<div class="od-amount"><div class="od-amount-label">订单金额</div><div class="od-amount-value">' + App.money(o.total_amount) + '</div></div>'
          + '</div>'
          + '<div class="od-card"><div class="od-card-title">收货信息</div>'
          + '<div class="od-receiver"><div class="od-receiver-row"><strong>' + o.receiver_name + '</strong><span class="od-phone">' + o.receiver_phone + '</span></div>'
          + '<div class="od-address">' + o.receiver_address + '</div>'
          + (o.remark ? '<div class="od-remark">备注：' + o.remark + '</div>' : '')
          + '</div></div>'
          + '<div class="od-card"><div class="od-card-title">订单商品</div><div class="od-goods-list">' + items + '</div></div>'
          + '<div class="od-card"><div class="od-card-title">金额明细</div><div class="od-summary">'
          + '<div class="od-sum-row"><span>商品小计</span><span>' + App.money(o.subtotal) + '</span></div>'
          + '<div class="od-sum-row"><span>运费</span><span>' + App.money(o.shipping_fee) + '</span></div>'
          + '<div class="od-sum-row"><span>优惠</span><span>-' + App.money(o.discount) + '</span></div>'
          + '<div class="od-sum-row total"><span>实付款</span><span class="od-total-amt">' + App.money(o.total_amount) + '</span></div>'
          + '</div></div>'
          + '<div class="od-card"><div class="od-card-title">订单信息</div><div class="od-info">'
          + '<div class="od-info-row"><span class="od-info-label">订单号</span><span class="od-info-val">' + o.order_no + '</span></div>'
          + '<div class="od-info-row"><span class="od-info-label">下单时间</span><span class="od-info-val">' + fmt(o.created_at) + '</span></div>'
          + (o.paid_at ? '<div class="od-info-row"><span class="od-info-label">支付时间</span><span class="od-info-val">' + fmt(o.paid_at) + '</span></div>' : '')
          + (o.shipped_at ? '<div class="od-info-row"><span class="od-info-label">发货时间</span><span class="od-info-val">' + fmt(o.shipped_at) + '</span></div>' : '')
          + pays
          + '</div></div>'
          + (actions ? '<div class="od-actions">' + actions + '</div>' : '');

        document.getElementById('od-body').style.display = '';
        document.getElementById('od-loading').style.display = 'none';

        var shipBtn = document.getElementById('od-ship');
        if (shipBtn) {
          shipBtn.onclick = function () {
            if (!confirm('确认对该订单发货？')) return;
            App.api('/api/admin/orders/' + o.order_no + '/ship', { method: 'POST', token: App.getAdminToken() })
              .then(function () { App.toast('已发货', 'success'); location.reload(); })
              .catch(function (e) { App.toast(e.message, 'error'); });
          };
        }
      }

      function load() {
        var orderNo = qs('order_no');
        if (!App.getAdminToken()) {
          document.getElementById('od-loading').style.display = 'none';
          document.getElementById('od-error').style.display = '';
          document.getElementById('od-error-msg').textContent = '请先登录管理后台';
          return;
        }
        if (!orderNo) {
          document.getElementById('od-loading').style.display = 'none';
          document.getElementById('od-error').style.display = '';
          document.getElementById('od-error-msg').textContent = '缺少订单号';
          return;
        }
        App.api('/api/admin/orders/' + orderNo, { token: App.getAdminToken() })
          .then(function (o) { render(o); })
          .catch(function (e) {
            document.getElementById('od-loading').style.display = 'none';
            document.getElementById('od-error').style.display = '';
            document.getElementById('od-error-msg').textContent = e.message || '订单不存在';
          });
      }

      document.getElementById('od-back').onclick = function () { history.back(); };
      load();
    })();
  </script>
</body>
</html>
